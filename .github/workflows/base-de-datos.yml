# Comprueba la base de datos en cada Pull Request y al entrar en main.
# Si una comprobación falla, el CI sale en rojo y dice cuál.
name: Base de datos

# El push solo en main: en una rama con PR, el pull_request ya lo comprueba.
# Con push en todas las ramas, cada cambio de un PR se comprobaría dos veces.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobaciones:
    name: Permisos y reglas (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # Versión fija: así una versión nueva de PGlite no rompe el CI por sorpresa.
      - name: Instala PGlite
        run: npm install --no-save @electric-sql/pglite@0.5.16
      - name: Ejecuta comprobar.mjs
        run: node supabase/tests/comprobar.mjs

  migraciones:
    name: Migraciones con la CLI de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      # Arranca el mismo Postgres que usa Supabase y aplica las migraciones y seed.sql.
      - name: Aplica migraciones y seed
        run: supabase db start
      - name: Comprueba que el seed se ha cargado
        run: |
          n=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from public.partes")
          echo "Partes cargados: $n"
          if [ "$n" != "20" ]; then
            echo "::error title=Seed no cargado::Hay $n partes y se esperaban 20"
            exit 1
          fi
      # Con los roles de verdad de Supabase: lo que cree una migración futura nace cerrado para anon.
      # Crea una tabla y una función como postgres, que es quien aplica las migraciones. Este Postgres se tira al acabar.
      - name: Comprueba que lo nuevo nace cerrado para la clave pública
        run: |
          r=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -tAc "
            create table public.prueba_nueva (id int);
            create function public.prueba_funcion() returns int language sql as 'select 1';
            select has_table_privilege('anon', 'public.prueba_nueva', 'select, insert, update, delete')
                or has_function_privilege('anon', 'public.prueba_funcion()', 'execute');")
          echo "¿anon puede usarlas?: $r"
          if [ "$r" != "f" ]; then
            echo "::error title=Permisos por defecto::Una tabla o función nueva queda abierta para anon"
            exit 1
          fi
