# Comprueba las herramientas de carga en cada Pull Request y al entrar en main.
name: Herramientas

# El push solo en main: en una rama con PR, el pull_request ya lo comprueba.
# Con push en todas las ramas, cada cambio de un PR se comprobaría dos veces.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tipos y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herramientas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # npm ci instala justo las versiones apuntadas en package-lock.json.
      - name: Instala las dependencias
        run: npm ci
      - name: Comprueba los tipos
        run: npm run tipos
      # Programas de fuera que usa «preparar»: OCR en español y euskera, y LibreOffice.
      - name: Instala ocrmypdf, Tesseract y LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr-spa tesseract-ocr-eus libreoffice-writer
      # Con EXIGIR_PROGRAMAS, las pruebas de OCR y de paso a PDF no se pueden saltar.
      - name: Ejecuta los tests
        run: npm test
        env:
          EXIGIR_PROGRAMAS: '1'
